name: Docs Quality Gates

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '24'

permissions:
  contents: read

jobs:
  quality-gates:
    name: Build, Check, Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type & content checks
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate CSP hashes
        run: npm run validate:csp

      - name: Validate lifecycle metadata
        run: npm run check:lifecycle

      - name: Link check (built HTML)
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          args: >-
            --no-progress
            --verbose
            --require-https
            --max-retries 3
            --retry-wait-time 2
            --timeout 20
            --exclude-mail
            --exclude-loopback
            --exclude '(^https://github\.com/PC-Mender/sjrs-lms-docs/edit/)'
            --root-dir ./dist
            --index-files index.html
            './dist/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
